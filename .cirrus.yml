env:
    CIRRUS_CLONE_DEPTH: 1
    rom_name: Nusantara
    device: lavender
    TELEGRAM_ID: $tg_id
    BOT_API: $bot_api

task:
  name: "Snx-R"
  timeout_in: 240m
  container:
      image: ghcr.io/snx-r/cirrus:latest
      cpu: 8
      memory: 32G
      stateful: true
      greedy: true
      volumes:
          - /home/cirrus:/home/cirrus
          - /home/cirrus/ccache:/home/cirrus/ccache
          - /home/cirrus/.config:/home/cirrus/.config
          
  cache_script:
    - sudo apt update && sudo apt install ccache -y

  storage_script:
    - df -h .
    - free -h

  vanilla_script:
    - mkdir Arrow && cd Arrow
    - curl https://gist.githubusercontent.com/Sa-Sajjad/b5dcfe1b1cd422144d6a09e1286bd4a2/raw/arrow.sh | bash
